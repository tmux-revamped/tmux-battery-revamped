set -g default-terminal "tmux-256color"
set -g escape-time 1000
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
set -g default-command "bash --noprofile --rcfile '$SCREENS_REPO/screens/setup.sh'"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
set -g display-time 3000
set-environment -g PATH "/Users/Shared/demo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g status-right "#{battery_color_status_fg}#{battery_icon_status}#[default] #{battery_color_charge_fg}#{battery_icon} #{battery_percentage}#[default] #{battery_remain} #{battery_power_source} #{battery_alert_icon}"
set -g status-right-length 110
set -g @battery_revamped_interval 1
set -g @battery_revamped_detail_interval 5
set -g @battery_revamped_charge_tier1_fg_color "#[fg=#f38ba8]"
set -g @battery_revamped_charge_tier2_fg_color "#[fg=#f38ba8]"
set -g @battery_revamped_charge_tier3_fg_color "#[fg=#f38ba8]"
set -g @battery_revamped_charge_tier4_fg_color "#[fg=#f9e2af]"
set -g @battery_revamped_charge_tier5_fg_color "#[fg=#f9e2af]"
set -g @battery_revamped_charge_tier6_fg_color "#[fg=#f9e2af]"
set -g @battery_revamped_charge_tier7_fg_color "#[fg=#a6e3a1]"
set -g @battery_revamped_charge_tier8_fg_color "#[fg=#a6e3a1]"
set -g @battery_revamped_status_charged_fg_color "#[fg=#a6e3a1]"
set -g @battery_revamped_status_charging_fg_color "#[fg=#a6e3a1]"
set -g @battery_revamped_status_discharging_fg_color "#[fg=#f9e2af]"
set -g @battery_revamped_status_attached_fg_color "#[fg=#89b4fa]"
set -g @battery_revamped_status_unknown_fg_color "#[fg=#6c7086]"
set -g @battery_revamped_low_icon "LOW"
set -g @battery_revamped_critical_icon "CRITICAL"
run-shell /Users/Shared/demo/tmux-battery-revamped/battery-revamped.tmux
